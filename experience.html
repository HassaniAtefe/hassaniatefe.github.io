<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="./theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="description" content="Research and industry experience — Alireza Salemi.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="_ds/organic-e0649fd3-164a-4b67-b454-afb71cc83849/styles.css">
  <script src="_ds/organic-e0649fd3-164a-4b67-b454-afb71cc83849/_ds_bundle.js"></script>
  <style>
    :root { --font-heading: "Spectral", serif; --font-heading-weight: 600; --font-body: "Karla", sans-serif; }
    :root {
      --color-bg: #eaf3f6;
      --color-surface: #dcebef;
      --color-text: #2a3538;
      --color-accent: #5b9bb0;
      --color-accent-2: #c9a13a;
      --color-hover: var(--color-accent);
      --color-divider: color-mix(in srgb, var(--color-text) 16%, transparent);

      --color-neutral-100: #f7fafb;
      --color-neutral-200: #eaf1f4;
      --color-neutral-300: #d3e0e5;
      --color-neutral-400: #b0c4cc;
      --color-neutral-500: #8ba2ab;
      --color-neutral-600: #67818c;
      --color-neutral-700: #4d626b;
      --color-neutral-800: #38474e;
      --color-neutral-900: #232c30;

      --color-accent-100: color-mix(in oklch, white 88%, var(--color-accent));
      --color-accent-200: color-mix(in oklch, white 74%, var(--color-accent));
      --color-accent-300: color-mix(in oklch, white 55%, var(--color-accent));
      --color-accent-400: color-mix(in oklch, white 28%, var(--color-accent));
      --color-accent-500: var(--color-accent);
      --color-accent-600: color-mix(in oklch, black 18%, var(--color-accent));
      --color-accent-700: color-mix(in oklch, black 35%, var(--color-accent));
      --color-accent-800: color-mix(in oklch, black 55%, var(--color-accent));
      --color-accent-900: color-mix(in oklch, black 72%, var(--color-accent));

      --color-accent-2-100: color-mix(in oklch, white 88%, var(--color-accent-2));
      --color-accent-2-200: color-mix(in oklch, white 74%, var(--color-accent-2));
      --color-accent-2-300: color-mix(in oklch, white 55%, var(--color-accent-2));
      --color-accent-2-400: color-mix(in oklch, white 28%, var(--color-accent-2));
      --color-accent-2-500: var(--color-accent-2);
      --color-accent-2-600: color-mix(in oklch, black 18%, var(--color-accent-2));
      --color-accent-2-700: color-mix(in oklch, black 35%, var(--color-accent-2));
      --color-accent-2-800: color-mix(in oklch, black 55%, var(--color-accent-2));
      --color-accent-2-900: color-mix(in oklch, black 72%, var(--color-accent-2));
    }
    html[data-theme="dark"] { --color-bg: var(--color-neutral-900); --color-surface: var(--color-neutral-800); --color-text: var(--color-neutral-100); --color-divider: color-mix(in srgb, var(--color-neutral-100) 18%, transparent); }
    body { margin: 0; }
    a { color: var(--color-hover); text-decoration: none; transition: color 0.2s ease; }
    a:hover { color: var(--color-hover); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 2px; }
    main a:not(.tag):not(.btn):not(.card), footer a:not(.tag):not(.btn):not(.card) {
      background-image: linear-gradient(var(--color-hover), var(--color-hover));
      background-position: 0 100%; background-repeat: no-repeat; background-size: 100% 1.5px;
      transition: background-size 0.2s ease;
    }
    main a:not(.tag):not(.btn):not(.card):hover, footer a:not(.tag):not(.btn):not(.card):hover {
      background-size: 100% 100%;
      background-image: linear-gradient(color-mix(in srgb, var(--color-hover) 20%, transparent), color-mix(in srgb, var(--color-hover) 20%, transparent));
    }
  </style>
  <script>(function(){ if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); })();</script>
</helmet>

<dc-import name="NavHeader" hint-size="100%,60px"></dc-import>

<main style="max-width:820px;margin:0 auto;padding:var(--space-8) var(--space-4);">
  <h1 style="font-size:34px;margin-bottom:var(--space-4);">Experience</h1>
  <div style="display:flex;flex-direction:column;">
    <sc-for list="{{ items }}" as="item" hint-placeholder-count="4">
      <div style="display:grid;grid-template-columns:190px 220px 1fr;gap:var(--space-4);padding:var(--space-4) 0;border-bottom:1px solid var(--color-divider);align-items:start;">
        <div>
          <sc-if value="{{ item.institutionHtml }}">
            <div dangerouslySetInnerHTML="{{ item.institutionHtml }}"></div>
          </sc-if>
        </div>
        <div>
          <sc-if value="{{ item.orgHtml }}">
            <div style="font-weight:700;" dangerouslySetInnerHTML="{{ item.orgHtml }}"></div>
          </sc-if>
          <div style="font-family:var(--font-heading);font-size:17px;margin-top:2px;">{{ item.role }}</div>
          <sc-if value="{{ item.location }}"><div style="opacity:0.6;font-size:13px;margin-top:6px;">{{ item.location }}</div></sc-if>
          <div style="opacity:0.6;font-size:13px;">{{ item.date }}</div>
        </div>
        <div>
          <sc-if value="{{ item.supervisorHtml }}">
            <p style="opacity:0.7;font-style:italic;font-size:14px;margin:0 0 6px;">Supervised by <span dangerouslySetInnerHTML="{{ item.supervisorHtml }}"></span></p>
          </sc-if>
          <sc-if value="{{ item.projectHtml }}">
            <p style="opacity:0.7;font-style:italic;font-size:14px;margin:0 0 6px;">Project: <span dangerouslySetInnerHTML="{{ item.projectHtml }}"></span></p>
          </sc-if>
          <sc-if value="{{ item.desc }}">
            <p style="opacity:0.85;font-size:14.5px;line-height:1.6;margin:0;">{{ item.desc }}</p>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>
</main>

<dc-import name="Footer" hint-size="100%,200px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { items: [] };
  componentDidMount() {
    fetch('data/experience.json').then(r => r.json()).then(items => this.setState({ items }))
      .catch(err => console.error('Failed to load experience:', err));
  }
  linkOrText(text, url) {
    return url ? `<a href="${url}" target="_blank" rel="noopener">${text}</a>` : text;
  }
  institutionHtml(item) {
    if (!item.institution) return null;
    const inner = item.institutionLogo
      ? `<img src="${item.institutionLogo}" alt="${item.institution}" style="max-height:46px;max-width:180px;width:auto;height:auto;display:block;">`
      : item.institution;
    return { __html: this.linkOrText(inner, item.institutionUrl) };
  }
  renderVals() {
    const items = this.state.items.map(item => ({
      ...item,
      orgHtml: item.org ? { __html: this.linkOrText(item.org, item.orgUrl) } : null,
      institutionHtml: this.institutionHtml(item),
      supervisorHtml: item.supervisor ? { __html: this.linkOrText(item.supervisor, item.supervisorUrl) } : null,
      projectHtml: item.project ? { __html: this.linkOrText(item.project, item.projectUrl) } : null,
    }));
    return { items };
  }
}
</script>
</body>
</html>
